name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build p2 repository
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-acp-p2
          path: releng/dev.eclipseacp.repository/target/repository
