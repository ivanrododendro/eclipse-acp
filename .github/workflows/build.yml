name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-arguments:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify native and batch argument invocation
        run: mvn --batch-mode --no-transfer-progress -pl releng/dev.eclipseacp.target,plugins/dev.eclipseacp.client.tests -am test
      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-acp-windows-test-reports
          path: plugins/dev.eclipseacp.client.tests/target/surefire-reports/**

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build p2 repository
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify p2 repository isolation
        run: bash scripts/verify-p2-isolation.sh releng/dev.eclipseacp.repository/target/repository
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-acp-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: error
      - name: Upload p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-acp-p2
          path: releng/dev.eclipseacp.repository/target/repository

  p2-compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eclipse-release: [2026-06, 2026-09]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-acp-p2
          path: releng/dev.eclipseacp.repository/target/repository
      - name: Verify install and uninstall on Eclipse ${{ matrix.eclipse-release }}
        run: bash scripts/verify-p2-installation.sh releng/dev.eclipseacp.repository/target/repository "https://download.eclipse.org/releases/${{ matrix.eclipse-release }}/"
