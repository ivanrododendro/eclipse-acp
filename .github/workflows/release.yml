name: Publish release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the p2 archive
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manually rerun workflow must rebuild the selected release tag,
          # not the then-current default branch.
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build p2 repository
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify p2 repository isolation
        run: bash scripts/verify-p2-isolation.sh releng/dev.eclipseacp.repository/target/repository
      - name: Preserve p2 repository for release job
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-acp-p2
          path: releng/dev.eclipseacp.repository/target/repository

  attach-p2-asset:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download p2 repository
        uses: actions/download-artifact@v4
        with:
          name: eclipse-acp-p2
          path: release/p2
      - name: Create archive and checksum
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          (
            cd release/p2
            zip -r "../../eclipse-acp-p2-${RELEASE_TAG}.zip" .
          )
          sha256sum "eclipse-acp-p2-${RELEASE_TAG}.zip" > "eclipse-acp-p2-${RELEASE_TAG}.zip.sha256"
      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "eclipse-acp-p2-$RELEASE_TAG.zip" "eclipse-acp-p2-$RELEASE_TAG.zip.sha256" --clobber

  publish-update-site:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download p2 repository
        uses: actions/download-artifact@v4
        with:
          name: eclipse-acp-p2
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload p2 update site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy p2 update site
        id: deployment
        uses: actions/deploy-pages@v4
